# Compose PRODUKSI (Tahap 10.5, hardening Tahap 3 & 4). Dev tetap memakai docker-compose.yml (Postgres + Mailpit).
#
#   cp .env.production.example .env.production   # lalu isi password DB, kunci data, pemegang kunci, SMTP
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate npx prisma db seed   # sekali, deploy pertama
# Panduan lengkap (termasuk menyalin backup ke luar server): docs/07-DEPLOYMENT.md.
#
# Alur start: db sehat → migrate (prisma migrate deploy + data:encrypt + recovery:refresh) selesai → app, worker, backup
# jalan → proxy setelah app sehat.
# Hardening Tahap 4 (docs/08-INVENTARIS-DATA.md):
#   - Tiap service hanya menerima env yang dibutuhkannya (tidak ada lagi env_file bersama). App & worker memakai role
#     oa_app, backup memakai oa_backup; hanya migrate yang memegang password pemilik database. Worker tidak memegang
#     AUTH_SECRET maupun kunci data.
#   - Database hanya di jaringan internal db_net (tanpa internet); pg_hba hanya db_net + scram; login & DDL dicatat.
#   - Container: no-new-privileges, cap_drop ALL, read-only + tmpfs, batas memori/CPU/proses, rotasi log, versi image dikunci.
name: office-automation-prod

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    <<: *hardening
    image: postgres:17.11-trixie
    restart: unless-stopped
    # Entrypoint image postgres menyiapkan folder data lalu turun ke user postgres (gosu).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs: ["/var/run/postgresql", "/tmp"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d %r "
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-office_automation}
      # Dipakai deploy/postgres/init-roles.sh (role oa_app & oa_backup).
      OA_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?isi POSTGRES_APP_PASSWORD di .env.production}
      OA_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?isi POSTGRES_BACKUP_PASSWORD di .env.production}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [db_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g, pids: 256 }

  migrate:
    <<: *hardening
    build: { context: ., target: migrate }
    restart: "no"
    # Tidak read-only: npx/tsx menulis cache di HOME & /tmp. Setelah migrasi, data:encrypt mengenkripsi data lama &
    # memeriksa kunci — kunci salah → gagal → app tidak start. recovery:refresh memperbarui titipan kunci data untuk
    # para pemegang kunci (rotasi kunci / RECOVERY_KEY_HOLDERS berubah ikut otomatis).
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx scripts/data-encrypt.ts && npx tsx scripts/recovery-refresh.ts"]
    environment:
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:-oa}:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env.production}@db:5432/${POSTGRES_DB:-office_automation}?schema=public
      DATABASE_URL: postgresql://oa_app:${POSTGRES_APP_PASSWORD:?isi POSTGRES_APP_PASSWORD di .env.production}@db:5432/${POSTGRES_DB:-office_automation}?schema=public
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?isi DATA_ENCRYPTION_KEYS di .env.production (npm run keys:generate)}
      DATA_INDEX_KEY: ${DATA_INDEX_KEY:?isi DATA_INDEX_KEY di .env.production (npm run keys:generate)}
      RECOVERY_KEY_HOLDERS: ${RECOVERY_KEY_HOLDERS:?isi email pemegang kunci (Pak Rudy & Pak Leonard) di .env.production}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_MUST_CHANGE_PASSWORD: ${SEED_MUST_CHANGE_PASSWORD:-true}
      TZ: Asia/Jakarta
    volumes:
      - uploads:/app/storage/uploads
      - recovery:/app/storage/recovery
    networks: [db_net]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g, pids: 256 }

  app:
    <<: *hardening
    build: { context: ., target: app }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    environment:
      DATABASE_URL: postgresql://oa_app:${POSTGRES_APP_PASSWORD:?isi POSTGRES_APP_PASSWORD di .env.production}@db:5432/${POSTGRES_DB:-office_automation}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET di .env.production}
      AUTH_URL: ${AUTH_URL:?isi AUTH_URL di .env.production}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      APP_URL: ${APP_URL:?isi APP_URL di .env.production}
      CSP_MODE: ${CSP_MODE:-enforce}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?isi DATA_ENCRYPTION_KEYS di .env.production (npm run keys:generate)}
      DATA_INDEX_KEY: ${DATA_INDEX_KEY:?isi DATA_INDEX_KEY di .env.production (npm run keys:generate)}
      # Pemegang kunci pemulihan (Setting → Kunci Pemulihan); ditetapkan di sini, tidak bisa diubah dari aplikasi.
      RECOVERY_KEY_HOLDERS: ${RECOVERY_KEY_HOLDERS:?isi email pemegang kunci (Pak Rudy & Pak Leonard) di .env.production}
      TZ: Asia/Jakarta
    # Tidak dipublikasikan ke host: hanya reverse proxy (service "proxy") yang boleh mengakses app:3000.
    volumes:
      - uploads:/app/storage/uploads
      - recovery:/app/storage/recovery
    networks: [db_net, edge]
    healthcheck:
      # /api/health (hardening Tahap 6): aplikasi hidup DAN database bisa dihubungi.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g, pids: 256 }

  worker:
    <<: *hardening
    build: { context: ., target: worker }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      DATABASE_URL: postgresql://oa_app:${POSTGRES_APP_PASSWORD:?isi POSTGRES_APP_PASSWORD di .env.production}@db:5432/${POSTGRES_DB:-office_automation}?schema=public
      SMTP_HOST: ${SMTP_HOST:?isi SMTP_HOST di .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?isi MAIL_FROM di .env.production}
      APP_URL: ${APP_URL:?isi APP_URL di .env.production}
      TZ: Asia/Jakarta
    # Job invoice.purge menghapus file invoice > 2 tahun dari volume upload yang sama dengan app (tanpa perlu kunci data).
    volumes:
      - uploads:/app/storage/uploads
    # egress: kirim email ke server SMTP.
    networks: [db_net, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m, pids: 128 }

  # Reverse proxy (hardening Tahap 3): satu-satunya pintu masuk — HTTPS, HSTS, rate limit, IP asli,
  # hanya jaringan di ALLOWED_SUBNETS. Port diikat ke IP LAN server (BIND_IP), bukan semua interface,
  # karena port Docker melewati firewall UFW Ubuntu. Tidak tersambung ke jaringan database.
  proxy:
    <<: *hardening
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    # Master nginx membuka port 80/443 sebagai root lalu worker turun ke user nginx.
    cap_add: [CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE, SETGID, SETUID]
    read_only: true
    tmpfs: ["/etc/nginx/conf.d", "/var/cache/nginx", "/run", "/tmp"]
    entrypoint: ["/bin/sh", "/opt/oa/proxy-start.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${BIND_IP:?isi BIND_IP di .env.production}:80:80"
      - "${BIND_IP:?isi BIND_IP di .env.production}:443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?isi APP_DOMAIN di .env.production}
      ALLOWED_SUBNETS: ${ALLOWED_SUBNETS:?isi ALLOWED_SUBNETS di .env.production}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/privkey.pem}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/proxy-start.sh:/opt/oa/proxy-start.sh:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
    networks: [edge]
    depends_on:
      app: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m, pids: 128 }

  # Backup harian terenkripsi (NF-06, hardening Tahap 4): pg_dump (role oa_backup) + arsip file upload, dikunci age
  # untuk gembok para pemegang kunci (volume recovery/penerima.txt, ditulis aplikasi), plus salinan folder kunci
  # pemulihan. Disimpan di ./backups, retensi BACKUP_KEEP_DAYS — salin ke luar server (docs/07-DEPLOYMENT.md).
  # Pulihkan: scripts/restore.sh.
  backup:
    <<: *hardening
    build: { context: ./deploy/backup }
    restart: unless-stopped
    # Menulis ke ./backups di host, apa pun pemilik foldernya.
    cap_add: [DAC_OVERRIDE]
    read_only: true
    tmpfs: ["/tmp"]
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: oa_backup
      PGPASSWORD: ${POSTGRES_BACKUP_PASSWORD:?isi POSTGRES_BACKUP_PASSWORD di .env.production}
      PGDATABASE: ${POSTGRES_DB:-office_automation}
      BACKUP_TIME: ${BACKUP_TIME:-01:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Jakarta
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
      - recovery:/recovery:ro
    networks: [db_net]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m, pids: 128 }

networks:
  # Jaringan database: internal (tanpa akses internet), hanya service yang butuh database.
  db_net:
    internal: true
  # Proxy ↔ app.
  edge: {}
  # Worker → server SMTP.
  egress: {}

volumes:
  pgdata:
  uploads:
  # Kunci pemulihan para pemegang kunci (src/lib/services/recovery-key.ts): ditulis app & migrate, dibaca backup.
  recovery:
