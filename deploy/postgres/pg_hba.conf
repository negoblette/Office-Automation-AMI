# pg_hba.conf PRODUKSI (hardening Tahap 4) — dipakai lewat `-c hba_file=` di docker-compose.prod.yml.
# Database hanya menerima koneksi dari jaringan Docker internal "db_net" (samenet: subnet yang tersambung langsung ke
# container database) dan dari socket lokal di dalam container. Semua wajib password scram-sha-256; sisanya ditolak.
# TYPE  DATABASE  USER  ADDRESS   METHOD
local   all       all             scram-sha-256
host    all       all   samenet   scram-sha-256
host    all       all   all       reject
